version: '3.8'

services:
  talkar-spaces-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talkar-spaces-crm
    restart: unless-stopped
    ports:
      - "7578:7578"
    environment:
      - PORT=7578
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - DOMAIN=spaces.talkar.in
    volumes:
      - ./data:/app/data
      - ./public/brochures:/app/public/brochures
