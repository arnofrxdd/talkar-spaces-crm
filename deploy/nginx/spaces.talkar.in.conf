# Nginx Configuration for spaces.talkar.in
# Place in /etc/nginx/sites-available/spaces.talkar.in
# and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name spaces.talkar.in;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name spaces.talkar.in;

    # SSL Certificates (managed via Certbot: sudo certbot --nginx -d spaces.talkar.in)
    # ssl_certificate /etc/letsencrypt/live/spaces.talkar.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/spaces.talkar.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Max upload size
    client_max_body_size 25M;

    # Proxy to Talkar Spaces Container on Unique Port 7578
    location / {
        proxy_pass http://127.0.0.1:7578;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) live ticker & board stream optimizations
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }
}
